name: Build Vector AI Pro Multi-Platform (APK & Universal)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build Android APK (Android 8.0+)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Web Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application
        run: npm run build

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Capacitor CLI & Android
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps

      - name: Initialize Android Project
        run: |
          npx cap add android || true
          
          # Ensure minimum SDK is 26 (Android 8.0 Oreo) for backward compatibility
          sed -i 's/minSdkVersion = .*/minSdkVersion = 26/' android/variables.gradle || true
          
          # Fix Kotlin duplicate class issues by forcing kotlin-bom
          sed -i 's/dependencies {/dependencies {\n    implementation platform("org.jetbrains.kotlin:kotlin-bom:1.8.22")/' android/app/build.gradle || true
          
          # Inject permissions into AndroidManifest.xml
          python3 -c "
          import re
          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          with open(manifest_path, 'r') as f:
              content = f.read()
          
          perms = '''
              <uses-permission android:name=\"android.permission.INTERNET\" />
              <uses-permission android:name=\"android.permission.ACCESS_NETWORK_STATE\" />
              <uses-permission android:name=\"android.permission.RECORD_AUDIO\" />
              <uses-permission android:name=\"android.permission.CAMERA\" />
              <uses-permission android:name=\"android.permission.MODIFY_AUDIO_SETTINGS\" />
              <uses-permission android:name=\"android.permission.VIBRATE\" />
          '''
          if '<uses-permission' not in content:
              content = content.replace('<application', perms + '\n    <application')
              with open(manifest_path, 'w') as f:
                  f.write(content)
          "
          
          npx cap sync android
          
          # Use bin distribution instead of all (35MB vs 160MB) for fast and reliable download
          sed -i 's/-all.zip/-bin.zip/' android/gradle/wrapper/gradle-wrapper.properties || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android Debug APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.internal.http.socketTimeout=120000 -Dorg.gradle.internal.http.connectionTimeout=120000"
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK Asset
        run: |
          mkdir -p dist-assets
          cp android/app/build/outputs/apk/debug/app-debug.apk dist-assets/vector-ai-pro.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vector-ai-pro-apk
          path: dist-assets/vector-ai-pro.apk

      - name: Release to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v2.5.2-release
          name: "Vector AI Pro v2.5.2 (Mobile Header & Admin Access Fix)"
          body: |
            ## Vector AI Pro v2.5.2 Sürümü Hazır! 🚀
            
            - 📱 **Mobil Üst Bar & Buton Düzeni:** Mobilde dik kullanımda sağdaki ses/ayarlar/menü butonlarının ekrandan taşma sorunu giderildi, tüm kontroller tam sığdırıldı.
            - 🔒 **Mobil Admin Panel Erişimi:** Mobil uygulamada admin paneline girişte yaşanan yetki ve CORS kısıtlamaları giderildi.
            - 💬 **Tam Ekran Sohbet:** Giriş yapıldığında doğrudan tam ekran modern sohbet arayüzü.
            - 🤖 **Android APK:** Android 8.0 ve tüm yeni sürümlerle tam uyumlu.
          files: |
            dist-assets/vector-ai-pro.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
