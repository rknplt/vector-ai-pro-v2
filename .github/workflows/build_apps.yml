name: Build Vector AI Pro Multi-Platform (APK & Universal)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build Android APK (Android 8.0+)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Web Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application
        run: npm run build

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Capacitor CLI & Android
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor-community/speech-recognition @capacitor-community/text-to-speech --legacy-peer-deps

      - name: Initialize Android Project
        run: |
          npx cap add android || true
          
          # Ensure minimum SDK is 26 (Android 8.0 Oreo) for backward compatibility
          sed -i 's/minSdkVersion = .*/minSdkVersion = 26/' android/variables.gradle || true
          
          # Fix Kotlin duplicate class issues by forcing kotlin-bom
          sed -i 's/dependencies {/dependencies {\n    implementation platform("org.jetbrains.kotlin:kotlin-bom:1.8.22")/' android/app/build.gradle || true
          
          # Inject permissions and speech recognition queries into AndroidManifest.xml
          python3 -c "
          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          with open(manifest_path, 'r') as f:
              content = f.read()
          
          perms = (
              '    <uses-permission android:name=\"android.permission.INTERNET\" />\n'
              '    <uses-permission android:name=\"android.permission.ACCESS_NETWORK_STATE\" />\n'
              '    <uses-permission android:name=\"android.permission.RECORD_AUDIO\" />\n'
              '    <uses-permission android:name=\"android.permission.CAMERA\" />\n'
              '    <uses-permission android:name=\"android.permission.MODIFY_AUDIO_SETTINGS\" />\n'
              '    <uses-permission android:name=\"android.permission.VIBRATE\" />\n'
              '    <uses-permission android:name=\"android.permission.WAKE_LOCK\" />\n'
          )
          
          queries = (
              '    <queries>\n'
              '        <intent>\n'
              '            <action android:name=\"android.speech.RecognitionService\" />\n'
              '        </intent>\n'
              '    </queries>\n'
          )
          
          if 'android.permission.RECORD_AUDIO' not in content:
              content = content.replace('<application', perms + queries + '    <application')
              with open(manifest_path, 'w') as f:
                  f.write(content)
          "
          
          # Configure MainActivity to allow audio autoplay without user gesture for assistant & drive mode
          python3 -c "
          main_act = 'android/app/src/main/java/com/vectorai/pro/MainActivity.java'
          code = (
              'package com.vectorai.pro;\n\n'
              'import android.os.Bundle;\n'
              'import android.webkit.WebSettings;\n'
              'import com.getcapacitor.BridgeActivity;\n\n'
              'public class MainActivity extends BridgeActivity {\n'
              '    @Override\n'
              '    public void onCreate(Bundle savedInstanceState) {\n'
              '        super.onCreate(savedInstanceState);\n'
              '        try {\n'
              '            if (this.bridge != null && this.bridge.getWebView() != null) {\n'
              '                WebSettings settings = this.bridge.getWebView().getSettings();\n'
              '                settings.setMediaPlaybackRequiresUserGesture(false);\n'
              '                settings.setJavaScriptCanOpenWindowsAutomatically(true);\n'
              '            }\n'
              '        } catch (Exception e) {\n'
              '            e.printStackTrace();\n'
              '        }\n'
              '    }\n'
              '}\n'
          )
          with open(main_act, 'w') as f:
              f.write(code)
          "
          
          npx cap sync android
          
          # Use reliable fast mirror to prevent GitHub release 504 gateway timeouts
          sed -i 's|https\\://services.gradle.org/distributions/.*|https\\://mirrors.cloud.tencent.com/gradle/gradle-8.11.1-bin.zip|' android/gradle/wrapper/gradle-wrapper.properties || true

      - name: Build Android Debug APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.internal.http.socketTimeout=120000 -Dorg.gradle.internal.http.connectionTimeout=120000"
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK Asset
        run: |
          mkdir -p dist-assets
          cp android/app/build/outputs/apk/debug/app-debug.apk dist-assets/vector-ai-pro.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vector-ai-pro-apk
          path: dist-assets/vector-ai-pro.apk

      - name: Release to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v2.5.5-release
          name: "Vector AI Pro v2.5.5 (Fix Speech Recognition, Drive Mode, Multi-Gender Voices & Multi-Language Sync)"
          body: |
            ## Vector AI Pro v2.5.5 Sürümü Hazır! 🚀
            
            - 🎙️ **Kusursuz Ses Tanıma & Uyanma Uyumu:** "Hey Vector" dedikten sonra konuşma tanıma oturumu (Speech Recognition) artık arka plan uyanma bekçisi tarafından kesilmez. Cümlenizi rahatça söyleyebilirsiniz, tamamlandığında mesaj otomatik iletilir.
            - 🚗 **Tam Çalışan Sürüş Modu:** Sürüş modunda dinleme, AI yanıtı ve sesli okuma döngüsü mükemmel çalışır. "Vector" dediğinizde sizi dinler, cevabı sesli okur ve tekrar sessizce uyanma kelimesini bekler.
            - 🗣️ **Kadın & Erkek Ses Ayrımı (Pitch & Voice Selection):** Emel (Kadın) ve Ahmet (Erkek) sesleri cihazınızda belirgin şekilde ayırt edilir. Android TTS ses motorunda frekans ve tonlama (pitch) ile kadın/erkek sesleri netleştirildi.
            - 🌐 **Ses & Sohbet Dili Senkronizasyonu:** Ses ayarlarından dil değiştirildiğinde (İngilizce, Almanca vb.) yapay zeka asistanı artık kesinlikle seçilen dilde yanıt verir. Karşılama mesajı ve konuşma tanıma dili otomatik güncellenir.
            - 📱 **Mobil Tam Ekran Sohbet:** Dik kullanımda üst ve alt çubuklar tam uyumlu ve temiz.
          files: |
            dist-assets/vector-ai-pro.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
