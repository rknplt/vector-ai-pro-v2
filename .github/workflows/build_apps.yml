name: Build Vector AI Pro Multi-Platform (APK & Universal)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build Android APK (Android 8.0+)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Web Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application
        run: npm run build

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Capacitor CLI & Android
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps

      - name: Initialize Android Project
        run: |
          npx cap add android || true
          
          # Ensure minimum SDK is 26 (Android 8.0 Oreo) for backward compatibility
          sed -i 's/minSdkVersion = .*/minSdkVersion = 26/' android/variables.gradle || true
          
          # Inject permissions into AndroidManifest.xml
          python3 -c "
          import re
          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          with open(manifest_path, 'r') as f:
              content = f.read()
          
          perms = '''
              <uses-permission android:name=\"android.permission.INTERNET\" />
              <uses-permission android:name=\"android.permission.ACCESS_NETWORK_STATE\" />
              <uses-permission android:name=\"android.permission.RECORD_AUDIO\" />
              <uses-permission android:name=\"android.permission.CAMERA\" />
              <uses-permission android:name=\"android.permission.MODIFY_AUDIO_SETTINGS\" />
              <uses-permission android:name=\"android.permission.VIBRATE\" />
          '''
          if '<uses-permission' not in content:
              content = content.replace('<application', perms + '\n    <application')
              with open(manifest_path, 'w') as f:
                  f.write(content)
          "
          
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Prepare APK Asset
        run: |
          mkdir -p dist-assets
          cp android/app/build/outputs/apk/debug/app-debug.apk dist-assets/vector-ai-pro.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vector-ai-pro-apk
          path: dist-assets/vector-ai-pro.apk

      - name: Release to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v2.5.0-release
          name: "Vector AI Pro v2.5.0 Multi-Platform"
          body: |
            ## Vector AI Pro v2.5.0 Sürümü Hazır! 🚀
            
            - 🤖 **Android APK:** Android 8.0 (Oreo) ve tüm yeni sürümlerle uyumlu.
            - 🎙️ **Sesli Uyanma:** "Hey Vector" ile anında sesli etkileşim.
            - 👑 **Ajan Ekibi:** 9 kişilik otonom şirket ajanları ve PC kontrolü.
            - 🔊 **Microsoft Neural TTS:** Kotasız, stüdyo kalitesinde Emel ve Ahmet sesleri.
          files: |
            dist-assets/vector-ai-pro.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
